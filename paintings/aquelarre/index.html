<!DOCTYPE html>
<html>
<head>
  <title>AquelARde</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="../../shared/ar-styles.css">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<!-- Pantalla para desbloquear audio -->
<div id="tapToStart">
  Toca para invocar el ritual y enfoca la pintura🔥
</div>

<a-scene
  mindar-image="imageTargetSrc: marker.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="fuegoImg" src="fire.webp">
    <audio id="musicaRitual" src="ritual.mp3" preload="auto"></audio>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- Target de la pintura -->
  <a-entity id="target" mindar-image-target="targetIndex: 0">

    <!-- FUEGO -->
   <a-plane
    src="#fuegoImg"
    material="transparent: true; shader: flat; side: double; alphaTest: 0.5"
    position="0 -0.25 0.1"
    width="0.5"
    height="0.5"

    animation__flicker="
      property: scale;
      to: 0.9 1.4 1;
      dir: alternate;
      dur: 400;
      loop: true;
      easing: easeInOutSine"

    animation__float="
      property: position;
      to: 0 -0.20 0.1;
      dir: alternate;
      dur: 1200;
      loop: true;
      easing: easeInOutSine"
>
  </a-plane>


  </a-entity>

</a-scene>

<script src="../../shared/ar-engine.js"></script>

</body>
</html>
